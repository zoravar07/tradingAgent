version: 1

portfolio:
  # Governs manual entry / mark-filled recording only — NOT Order Builder's
  # output, which always produces whole-share BUY/exit quantities via
  # floor()/int() math regardless of this flag (agents/order_builder.py).
  # This account trades fractional shares (IBKR fractional-share investing),
  # so existing holdings can be fractional even though every order Z Money
  # itself proposes is whole-share by construction.
  allow_fractional: true

schedule:
  nightly_run: "0 22 * * 0-4"    # after US close, briefing ready by morning

universe:
  include_holdings_always: true
  watchlist: [AMD, NVDA, MRVL, CRDO, NBIS, VRT, CLS, CEG, MP, PLTR, RKLB, SOFI, MSFT]
  # Day-to-day universe = holdings + watchlist + extra_tickers + the scan
  # pool. Pool membership is the S&P 500 list parsed from Wikipedia
  # (sources/index_constituents.py) — FMP's constituents endpoint is
  # 402-gated on this plan, which is why every run before run 6 screened
  # only the names already held.
  # SP500 = Wikipedia's index list. US_ALL = every NASDAQ/NYSE/AMEX/Arca/Cboe
  # common stock (NASDAQ Trader symbol directory, ~5,000), pre-gated on the
  # stage1 liquidity/market-cap floors from yfinance screener data before
  # any per-name fetch (~1,900 pass) — sources/us_listing.py.
  rotating_pool_source: US_ALL
  # 0 = scan the whole pool every day. Stage 1 runs on yfinance only (zero
  # FMP calls), so this no longer threatens the 250/day FMP cap; FMP budget
  # is spent only on names that reach Research. Set to e.g. 30 to go back to
  # a rotating slice if yfinance rate-limits a full daily scan.
  rotating_scan_size: 0
  # Names outside the index to screen every day (not rotated). Empty by
  # default — add small caps or foreign listings yfinance can price.
  extra_tickers: []
  weekly_wide_scan:
    enabled: false                 # flip on if you upgrade past the FMP free tier
    day_of_week: 6                 # 0=Mon..6=Sun (Python weekday numbering) — Sunday by default
  # §9's own note names these 10 tickers as "your AI/semis cluster" — that
  # note is the source of this map, not a guess. Extend it for other themes.
  cluster_overrides:
    AMD: ai_semis
    NVDA: ai_semis
    MRVL: ai_semis
    CRDO: ai_semis
    NBIS: ai_semis
    VRT: ai_semis
    CLS: ai_semis
    CEG: ai_semis
    MP: ai_semis
    PLTR: ai_semis
  # Not in the spec — added after a live run flagged a false "no research
  # coverage" alarm for these three. ETFs have no income statement in any
  # data source; the fundamental-floor gate is a category error for them,
  # not a data gap. Seeded with this user's own core_longterm sleeve (§9's
  # comment: "VTI, VGT, IAU — held, not actively traded").
  etf_tickers: [VTI, VGT, IAU]

screener:
  stage1:
    min_avg_daily_volume_usd: 20000000
    min_market_cap_usd: 2000000000
    max_survivors: 40
    # Below: §5.1 names these gates ("fundamental floor", "valuation bands",
    # "earnings proximity flag") but the spec text doesn't give numbers.
    # Defaults chosen here, not spec'd — revisit once step 4's output has
    # been eyeballed against real names (per §10 step 4).
    min_revenue_growth_pct: 5.0      # fundamental floor: positive FCF OR growth >= this
    valuation_pe_cheap_max: 15.0     # trailing P/E at or below this -> "cheap" (flag only)
    valuation_pe_expensive_min: 30.0 # trailing P/E at or above this -> "expensive" (flag only)
    earnings_proximity_days: 5       # flag if earnings are within this many days
  stage2:
    model: claude-haiku-4-5
    max_survivors: 15
    # One structured Haiku call per batch over cached Stage 1 numbers — no
    # web search. Stage 2 prioritises; the research digest does the
    # fact-finding, only for names that get a memo.
    batch_size: 40

research:
  model: claude-sonnet-4-6
  max_candidates_per_run: 10          # hard cap on NEW names memo'd per run (15 -> 10 on 2026-09-10 to hold a run under $0.75)
  # Grounded news: one web-search call per memo'd name, on the cheap model,
  # one targeted search, cached 48h. Never falls back to model memory when
  # off — the section is simply empty. See agents/research.py.
  web_search_enabled: true
  web_search_max_uses: 1
  digest_model: claude-haiku-4-5
  news_lookback_days: 7
  news_cache_hours: 48
  # Held positions: ceil(held / 7) get a fresh memo each run, oldest first,
  # so the book cycles weekly at a flat daily cost. In between, the last
  # real score is reused and shown with its age.
  holdings_refresh_days: 7

order_builder:
  # §5.4 names the job ("limit price from recent price action and spread")
  # but not a formula; not itself a numbered §10 step. Defaults below are
  # not spec'd — see core/config.py's OrderBuilderConfig docstring.
  limit_buffer_pct: 0.5
  profit_trim_fraction: 0.5

sleeves:                         # % of NAV
  core_longterm: 35              # VTI, VGT, IAU — held, not actively traded
  thematic: 45
  tactical: 15
  cash_buffer: 5

risk:
  max_position_pct: 12
  max_sector_pct: 40
  max_correlated_cluster_pct: 50    # see note below
  max_daily_proposals: 5
  max_daily_loss_pct: 3
  max_drawdown_pct: 12
  min_order_value_usd: 150          # avoid orders where costs dominate
  # Below: §5.3 names "position sizing from conviction and volatility" and
  # "thesis decay since entry" as mechanisms but doesn't give formulas or
  # thresholds. Defaults chosen here, not spec'd — see risk_rules.py.
  reference_atr_pct_of_price: 3.0   # ATR as % of price treated as "normal" volatility
  min_volatility_size_multiplier: 0.25  # a highly volatile name still gets >= 25% of its conviction-implied size
  thesis_decay_trigger_pts: 15.0    # conviction-point drop since entry that flags decay
  # Not in the spec — added after a live run where a data-source gap
  # silently zeroed out part of NAV. Zero tolerance: any held position that
  # can't be priced halts the whole run rather than publish on a broken NAV.
  max_unpriced_held_positions: 0
  # C_enter / C_exit — user-requested recalibration of the portfolio
  # framework document's conviction bands (2026-09-15 decision). The
  # framework doc specifies C_enter 65 / C_exit 55, but those don't match
  # what the scorer actually produces: Run 8's best new candidate scored
  # only 60.8, and eight current holdings sit below 55 — those numbers
  # would sell most of the book and never buy anything again. Revisit both
  # once there's an actual track record showing the conviction score
  # predicts something, not by feel.
  conviction_enter_floor: 58.0  # C_enter: a new-BUY candidate below this is never sized at all
  # C_exit (was min_hold_conviction, added after a live run where RKLB
  # (conviction 36) and MP (38) generated no proposal despite memos
  # describing accelerating cash burn: no entry baseline (thesis decay
  # can't fire), hadn't dropped in price (no trailing stop/profit band
  # either)). A held SWING position below this always gets a proposed
  # exit, regardless of P&L or entry baseline. Not used by CORE/HEDGE_CASH/
  # SPECULATIVE — see core/risk_rules.py's sleeve gating.
  min_hold_conviction: 42.0
  # The runner rule (user-requested, 2026-09-15): entry limits above
  # (max_position_pct, sector/cluster caps) constrain what a NEW position
  # can be sized to — they never trim a position for having grown past
  # them by appreciation. Applies to every sleeve regardless of that
  # sleeve's other exit gating (the "concentration breach" CORE/HEDGE_CASH
  # can still be trimmed on). Never trims for growth alone below
  # runner_trim_trigger_pct; crossing it trims down to runner_trim_target_pct,
  # not back to any entry weight.
  runner_trim_trigger_pct: 30.0
  runner_trim_target_pct: 25.0

conviction_weights:                 # auto-normalised; add or remove freely
  business_quality: 0.15
  financial_health: 0.10
  whats_priced_in: 0.15
  variant_perception: 0.10
  earnings_quality: 0.10
  catalyst_path: 0.08
  downside_asymmetry: 0.10
  ownership_flow: 0.07
  analyst_signals: 0.05
  news_sentiment: 0.03
  technical_momentum: 0.07
  portfolio_fit: 0.00               # penalty-only, applied after roll-up
  discord_signal: 0.00              # earn the weight with data

conviction_scaling:
  activation_threshold_pct:   { at_0: 8,   at_100: 35 }
  trailing_stop_atr_multiple: { at_0: 1.5, at_100: 4.5 }
  profit_taking_start_pct:    { at_0: 15,  at_100: 60 }

sleeves:
  default_sleeve: SWING
  breach_sustain_days: 10
  breach_margin_pct: 5.0
  definitions:
    CORE:        { target_pct: 50, band_low_pct: 40, band_high_pct: 65, tickers: [VTI, VGT] }
    HEDGE_CASH:  { target_pct: 13, band_low_pct: 8,  band_high_pct: 25, tickers: [IAU], includes_account_cash: true }
    SWING:       { target_pct: 30, band_low_pct: 15, band_high_pct: 40, tickers: [] }
    SPECULATIVE: { target_pct: 7,  band_low_pct: 0,  band_high_pct: 12, tickers: [RKLB, SOFI], slot_count: 5, slot_pct: 2.5, hard_stop_pct: -60, reclass_at_pct: 15, oversized_slot_multiple: 2.0 }

# Informational-only "this smells speculative" warning on a new SWING BUY —
# never blocks, never reclassifies. market_cap_below_usd is a guess, not
# measured against RKLB/SOFI's actual entry caps (see core/config.py).
speculative_look:
  market_cap_below_usd: 10000000000

sources:
  fmp:             { enabled: true }
  prices:          { enabled: true }
  discord_signals: { enabled: false, channels: [], lookback_hours: 48 }

options:
  enabled: false                    # only after the equity loop is proven

briefing:
  watching_max_items: 12            # "Watching" shows the N near-misses closest to their trigger
budget:
  # Raised 40 -> 80 (2026-09-09) to cover grounded web search in Stage 2 and
  # Research at the full ~512-name universe: ~$0.01/search on top of tokens.
  monthly_api_cap_usd: 80           # halts LLM calls if exceeded
  max_run_cost_usd: 0.75            # pre-flight: a run projected above this refuses to start
