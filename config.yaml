version: 1

portfolio:
  import_reminder_days: 7        # warn if positions haven't been verified recently
  allow_fractional: false        # you place orders manually — whole shares only

schedule:
  nightly_run: "0 22 * * 0-4"    # after US close, briefing ready by morning

universe:
  include_holdings_always: true
  watchlist: [AMD, NVDA, MRVL, CRDO, NBIS, VRT, CLS, CEG, MP, PLTR, RKLB, SOFI, MSFT]
  # Day-to-day universe = holdings + watchlist + a rotating slice of this
  # pool, so the FMP call budget (250/day free tier) is never at risk.
  # The full pool still gets covered over time — at 30/day it takes about
  # 17 days to rotate through all ~500 S&P 500 names once.
  rotating_pool_source: SP500
  rotating_scan_size: 30
  weekly_wide_scan:
    enabled: false                 # flip on if you upgrade past the FMP free tier
    day_of_week: 6                 # 0=Mon..6=Sun (Python weekday numbering) — Sunday by default
  # §9's own note names these 10 tickers as "your AI/semis cluster" — that
  # note is the source of this map, not a guess. Extend it for other themes.
  cluster_overrides:
    AMD: ai_semis
    NVDA: ai_semis
    MRVL: ai_semis
    CRDO: ai_semis
    NBIS: ai_semis
    VRT: ai_semis
    CLS: ai_semis
    CEG: ai_semis
    MP: ai_semis
    PLTR: ai_semis

screener:
  stage1:
    min_avg_daily_volume_usd: 20000000
    min_market_cap_usd: 2000000000
    max_survivors: 40
    # Below: §5.1 names these gates ("fundamental floor", "valuation bands",
    # "earnings proximity flag") but the spec text doesn't give numbers.
    # Defaults chosen here, not spec'd — revisit once step 4's output has
    # been eyeballed against real names (per §10 step 4).
    min_revenue_growth_pct: 5.0      # fundamental floor: positive FCF OR growth >= this
    valuation_pe_cheap_max: 15.0     # trailing P/E at or below this -> "cheap" (flag only)
    valuation_pe_expensive_min: 30.0 # trailing P/E at or above this -> "expensive" (flag only)
    earnings_proximity_days: 5       # flag if earnings are within this many days
  stage2:
    model: claude-haiku-4-5
    lookback_days: 7
    max_survivors: 15

research:
  model: claude-sonnet-4-6
  max_candidates_per_run: 15

order_builder:
  # §5.4 names the job ("limit price from recent price action and spread")
  # but not a formula; not itself a numbered §10 step. Defaults below are
  # not spec'd — see core/config.py's OrderBuilderConfig docstring.
  limit_buffer_pct: 0.5
  profit_trim_fraction: 0.5

sleeves:                         # % of NAV
  core_longterm: 35              # VTI, VGT, IAU — held, not actively traded
  thematic: 45
  tactical: 15
  cash_buffer: 5

risk:
  max_position_pct: 12
  max_sector_pct: 40
  max_correlated_cluster_pct: 50    # see note below
  max_daily_proposals: 5
  max_daily_loss_pct: 3
  max_drawdown_pct: 12
  min_order_value_usd: 150          # avoid orders where costs dominate
  # Below: §5.3 names "position sizing from conviction and volatility" and
  # "thesis decay since entry" as mechanisms but doesn't give formulas or
  # thresholds. Defaults chosen here, not spec'd — see risk_rules.py.
  reference_atr_pct_of_price: 3.0   # ATR as % of price treated as "normal" volatility
  min_volatility_size_multiplier: 0.25  # a highly volatile name still gets >= 25% of its conviction-implied size
  thesis_decay_trigger_pts: 15.0    # conviction-point drop since entry that flags decay

conviction_weights:                 # auto-normalised; add or remove freely
  business_quality: 0.15
  financial_health: 0.10
  whats_priced_in: 0.15
  variant_perception: 0.10
  earnings_quality: 0.10
  catalyst_path: 0.08
  downside_asymmetry: 0.10
  ownership_flow: 0.07
  analyst_signals: 0.05
  news_sentiment: 0.03
  technical_momentum: 0.07
  portfolio_fit: 0.00               # penalty-only, applied after roll-up
  discord_signal: 0.00              # earn the weight with data

conviction_scaling:
  activation_threshold_pct:   { at_0: 8,   at_100: 35 }
  trailing_stop_atr_multiple: { at_0: 1.5, at_100: 4.5 }
  profit_taking_start_pct:    { at_0: 15,  at_100: 60 }

sources:
  fmp:             { enabled: true }
  prices:          { enabled: true }
  discord_signals: { enabled: false, channels: [], lookback_hours: 48 }

options:
  enabled: false                    # only after the equity loop is proven

budget:
  monthly_api_cap_usd: 40           # halts LLM calls if exceeded
